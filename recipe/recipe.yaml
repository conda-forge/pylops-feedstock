schema_version: 1

context:
  name: pylops
  version: 2.9.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pylops-${{ version }}.tar.gz
  sha256: 8cf028b6db3b9e2520d02ec75b7187346f2fd6788dc5079a9baba51d4b8a8f76

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=2.0.0
    - scipy >=1.13.0
tests:
  - python:
      imports:
        - pylops
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  license: LGPL-3.0-or-later
  license_file: LICENSE
  summary: PyLops – A Linear-Operator Library for Python
  description: |
    Python library implementing linear operators to allow solving large-scale optimization
    problems without requiring to explicitly create a dense (or sparse) matrix.
  homepage: https://github.com/PyLops/pylops
  repository: https://github.com/PyLops/pylops
  documentation: https://pylops.readthedocs.io

extra:
  recipe-maintainers:
    - jan-janssen
    - mrava87
