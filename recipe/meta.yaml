{% set name = "pylops" %}
{% set version = "2.8.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pylops-{{ version }}.tar.gz
  sha256: 7fb6a3e4c57f14059131aded722ae9c331c12f26075d7e7e98e4ec3915e1262c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.21.0
    - scipy >=1.11.0

test:
  imports:
    - pylops
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/PyLops/pylops
  license: LGPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: PyLops – A Linear-Operator Library for Python
  description: |
    Python library implementing linear operators to allow solving large-scale optimization
    problems without requiring to explicitly create a dense (or sparse) matrix.
  doc_url: https://pylops.readthedocs.io
  dev_url: https://github.com/PyLops/pylops

extra:
  recipe-maintainers:
    - jan-janssen
    - mrava87
